services:
  # Go API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nauthilus-ui
    restart: unless-stopped
    environment:
      - NAUTHILUS_UI_CONFIG_FILE=/app/config.yaml
      - NAUTHILUS_UI_SERVER_PROXY_PUBLIC_PORT=443
      - NAUTHILUS_UI_DATABASE_MONGODB_URI=mongodb://${MONGODB_ROOT_USER:-nauthilus}:${MONGODB_ROOT_PASSWORD:-nauthilus_password}@mongo:27017/nauthilus-ui?authSource=admin
    ports:
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - mongo
    networks:
      - nauthilus-network

  # MongoDB database
  mongo:
    image: mongo:latest
    container_name: nauthilus-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=nauthilus-ui
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USER:-nauthilus}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD:-nauthilus_password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - nauthilus-network

networks:
  nauthilus-network:
    driver: bridge

volumes:
  mongodb_data:
