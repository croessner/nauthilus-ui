services:
  # Express API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nauthilus-api
    restart: unless-stopped
    environment:
      - EXPRESS_PORT=3001
      - EXPRESS_ADDRESS=0.0.0.0
      - MONGODB_URI=mongodb://${MONGODB_ROOT_USER:-nauthilus}:${MONGODB_ROOT_PASSWORD:-nauthilus_password}@mongo:27017/nauthilus-ui?authSource=admin
      - REACT_APP_JWT_SECRET=your-jwt-secret-key-change-in-production
    depends_on:
      - mongo
    networks:
      - nauthilus-network

  # Nginx web server
  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: nauthilus-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - nauthilus-network

  # MongoDB database
  mongo:
    image: mongo:latest
    container_name: nauthilus-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=nauthilus-ui
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USER:-nauthilus}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD:-nauthilus_password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - nauthilus-network

networks:
  nauthilus-network:
    driver: bridge

volumes:
  mongodb_data:
