services:
  # Go API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nauthilus-ui
    restart: unless-stopped
    environment:
      - FRONTEND_PORT=3001
      - FRONTEND_ADDRESS=0.0.0.0
      - PROXY_PORT=3002
      - PROXY_ADDRESS=0.0.0.0
      - REACT_APP_PROXY_PORT=443
      - MONGODB_URI=mongodb://${MONGODB_ROOT_USER:-nauthilus}:${MONGODB_ROOT_PASSWORD:-nauthilus_password}@mongo:27017/nauthilus-ui?authSource=admin
      - REACT_APP_JWT_SECRET=your-jwt-secret-key-change-in-production
    ports:
      - "3001:3001"
      - "3002:3002"
    depends_on:
      - mongo
    networks:
      - nauthilus-network

  # MongoDB database
  mongo:
    image: mongo:latest
    container_name: nauthilus-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=nauthilus-ui
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USER:-nauthilus}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD:-nauthilus_password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - nauthilus-network

networks:
  nauthilus-network:
    driver: bridge

volumes:
  mongodb_data:
